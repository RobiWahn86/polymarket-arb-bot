[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "polymarket-arb-bot"
version = "1.0.0"
description = "Vollautomatischer Arbitrage-Trading-Bot für Polymarket Prediction Markets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Argo.cashflow", email = "argo@argo.cashflow"},
]
dependencies = [
  "py-clob-client-v2>=0.1.0",
  "flask>=3.0.0",
  "chart.js>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/argo-cashflow/polymarket-arb-bot"
Documentation = "https://github.com/argo-cashflow/polymarket-arb-bot#readme"

[project.scripts]
polymarket-bot = "polymarket_arb_bot.main:run_bot"
polymarket-dashboard = "polymarket_arb_bot.dashboard:main"

[tool.setuptools.packages.find]
include = ["polymarket_arb_bot*"]
